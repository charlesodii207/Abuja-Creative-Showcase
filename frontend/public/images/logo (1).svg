<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Africa Creative Showcase</title>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="#14100E"/>

  <!-- Diamond quadrants -->
  <!-- Top (navy) -->
  <polygon points="100,20 20,100 100,100" fill="#16213A"/>
  <!-- Right (gold) -->
  <polygon points="100,20 180,100 100,100" fill="#E59200"/>
  <!-- Bottom (red) -->
  <polygon points="180,100 100,180 100,100" fill="#B80319"/>
  <!-- Left (teal) -->
  <polygon points="100,180 20,100 100,100" fill="#00A5A8"/>

  <!-- Center ring -->
  <circle cx="100" cy="100" r="10" fill="#14100E"/>
  <circle cx="100" cy="100" r="7" fill="#F5EFE6"/>
</svg>
